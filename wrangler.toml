name = "stormforge"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# --- Durable Objects: parallel scan orchestration ---
[[durable_objects.bindings]]
name = "SCAN_ORCHESTRATOR"
class_name = "ScanOrchestrator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScanOrchestrator"]

# --- KV: findings + scope + task queue persistence ---
[[kv_namespaces]]
binding = "STORMFORGE_KV"
id = "3776640fe73c44eebdc1a74f6c92d277"
preview_id = "3776640fe73c44eebdc1a74f6c92d277"

[vars]
# Global rate limit (requests/sec) for passive probing.
MAX_RPS = "5"
# Per-scan concurrency cap.
MAX_CONCURRENCY = "8"
# "detect" = passive checks. "hybrid" = passive + dispatches to executor.
SCAN_MODE = "hybrid"
# LLM planner for intelligent path/vuln prioritization.
LLM_PLANNER_ENDPOINT = ""
LLM_PLANNER_MODEL = ""
# Secrets (set with `wrangler secret put <NAME>`):
#   LLM_PLANNER_API_KEY — OpenAI/OpenRouter/xAI key for the planner
#   EXECUTOR_SECRET     — Required shared secret for executor + plan/dispatch
# Local only: set ALLOW_INSECURE_EXECUTOR = "true" to allow missing secret (never in prod).
# ALLOW_INSECURE_EXECUTOR = "true"
#
# RoE-GATED ACTIVE TESTING — OFF by default. Only enable for programs whose
# rules of engagement permit active testing. When "true" (or SCAN_MODE contains
# "active") AND scope.authorized, the scanner runs canary-based, non-destructive
# active checks: open redirect + host-header reflection (GET-only, rate-limited,
# cache-busted so no shared cache is poisoned). Leave unset for passive-only.
# ACTIVE_TESTING = "true"
#
# OAST out-of-band SSRF confirmation (secret, not a plain var):
#   npx wrangler secret put OAST_COLLABORATOR_ENDPOINT
# Format: "https://collab.example.com"  OR  "https://poll.example.com/base|callback.example.com".
# When set AND active testing is on, SSRF candidates get unique canaries; poll
# via POST /api/oast/poll to correlate DNS/HTTP interactions. See README "OAST".
