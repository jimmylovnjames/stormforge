name = "stormforge"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# --- Durable Objects: parallel scan orchestration ---
[[durable_objects.bindings]]
name = "SCAN_ORCHESTRATOR"
class_name = "ScanOrchestrator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScanOrchestrator"]

# --- KV: findings + scope + task queue persistence ---
[[kv_namespaces]]
binding = "STORMFORGE_KV"
id = "3776640fe73c44eebdc1a74f6c92d277"
preview_id = "3776640fe73c44eebdc1a74f6c92d277"

[vars]
# Global rate limit (requests/sec) for passive probing.
MAX_RPS = "5"
# Per-scan concurrency cap.
MAX_CONCURRENCY = "8"
# "detect" = passive checks. "hybrid" = passive + dispatches to executor.
SCAN_MODE = "hybrid"
# LLM planner for intelligent path/vuln prioritization.
LLM_PLANNER_ENDPOINT = ""
LLM_PLANNER_MODEL = ""
# Secrets (set with `wrangler secret put <NAME>`):
#   LLM_PLANNER_API_KEY — OpenAI/OpenRouter key for the planner
#   EXECUTOR_SECRET     — Shared secret for executor auth
